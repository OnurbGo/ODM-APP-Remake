<!-- Ícone do Olho da Morte, desenho próprio a partir da abertura: olho com a íris de tambor de revólver.
     Fonte de todos os tamanhos a partir de 32 px. Até 24 px, vale icone-16.svg.
     Grade de 108 do ícone adaptativo do Android: "fundo" preenche tudo e "figura" fica dentro da zona segura de 66.
     Cores de pacotes/estilo/src/tokens/primitivos.css: tinta, pergaminho, sangue e ouro. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <g id="fundo">
    <rect width="108" height="108" fill="#0f0c09"/>
  </g>
  <g id="figura" transform="translate(21 21) scale(1.03125)">
    <path d="M4 32Q32-8 60 32Q32 72 4 32Z" fill="#e4dccb"/>
    <circle cx="32" cy="32" r="17" fill="#7a1610"/>
    <g fill="#e4dccb">
      <circle cx="32" cy="15" r="3.6"/>
      <circle cx="46.72" cy="23.5" r="3.6"/>
      <circle cx="46.72" cy="40.5" r="3.6"/>
      <circle cx="32" cy="49" r="3.6"/>
      <circle cx="17.28" cy="40.5" r="3.6"/>
      <circle cx="17.28" cy="23.5" r="3.6"/>
    </g>
    <circle cx="32" cy="32" r="5" fill="#0f0c09"/>
    <circle cx="32" cy="32" r="2" fill="#a57c2c"/>
  </g>
</svg>
